# «Чек → трата» on a real phone (ТЗ, M4: «Maestro проходит сценарий „скан → трата“»).
# The camera cannot be pointed at a QR from a test, so the receipt goes in by manual entry: it builds the same
# FNS string a scan gives and goes the same way (queue → receipts-api → worker → core-api).
#
# Before running (see mobile/README.md, «Maestro»): the dev build installed, Metro and the local services up,
# `adb reverse` done, the app signed in, «Вход по отпечатку» off (a test cannot touch the sensor).
appId: ru.reactmoney.receipts.dev
---
# the dev build opens the launcher; this link points it straight at Metro on the laptop
- openLink: exp+react-money-receipts://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081
- extendedWaitUntil:
    visible: "Ввести вручную"
    timeout: 60000 # the first bundle over USB takes a while
- tapOn: "Ввести вручную"

# a fresh ФД and ФП every run, or the receipt would be a duplicate of the previous run
- evalScript: ${output.fd = String(Date.now()).slice(-9); output.fp = String(Math.floor(Math.random() * 1e9))}
- tapOn:
    id: manual-amount
- inputText: "123,45"
- tapOn:
    id: manual-fn
- inputText: "9960440300000777"
- tapOn:
    id: manual-i
- inputText: ${output.fd}
- tapOn:
    id: manual-fp
- inputText: ${output.fp}
- hideKeyboard
- tapOn: "Отправить"

# queue → 202 → worker → expense in react-money; the status screen polls until it is final
- extendedWaitUntil:
    visible: "Трата 123,45.*добавлена"
    timeout: 20000
- takeScreenshot: manual-receipt-done
