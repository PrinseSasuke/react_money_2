# Account for the Chaos Mesh dashboard: may run chaos experiments in react-money only.
# Token for the dashboard login:  kubectl -n react-money create token chaos-experimenter --duration=24h
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-experimenter
  namespace: react-money
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaos-experimenter
  namespace: react-money
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["chaos-mesh.org"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaos-experimenter
  namespace: react-money
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chaos-experimenter
subjects:
  - kind: ServiceAccount
    name: chaos-experimenter
    namespace: react-money
