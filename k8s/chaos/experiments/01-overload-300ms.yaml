# 01 · Граница перегрузки: +300ms на пакеты backend → postgres, 5 минут.
# Гипотеза: потолок 20/0.3 ≈ 66 ответов/с < нагрузки 100: очередь растёт каждую секунду (каскад).
# Запуск (сначала нагрузка и 3 минуты «нормы»):  kubectl create -f ~/experiments/01-overload-300ms.yaml
# Grafana: «01 · Граница перегрузки»
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  generateName: overload-300ms-
  namespace: react-money
spec:
  action: delay
  mode: all
  selector:
    namespaces: [react-money]
    labelSelectors: {app: backend}
  direction: to
  target:
    mode: all
    selector:
      namespaces: [react-money]
      labelSelectors: {app: postgres}
  delay:
    latency: "300ms"
    jitter: "10ms"
    correlation: "0"
  duration: "5m"
