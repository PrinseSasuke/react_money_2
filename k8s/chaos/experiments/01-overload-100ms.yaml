# 01 · Граница перегрузки: +100ms на пакеты backend → postgres, 5 минут.
# Гипотеза: потолок 20/0.1 = 200 ответов/с > нагрузки 100: очереди нет, ответ просто ~0.1 с.
# Запуск (сначала нагрузка и 3 минуты «нормы»):  kubectl create -f ~/experiments/01-overload-100ms.yaml
# Grafana: «01 · Граница перегрузки»
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  generateName: overload-100ms-
  namespace: react-money
spec:
  action: delay
  mode: all
  selector:
    namespaces: [react-money]
    labelSelectors: {app: backend}
  direction: to
  target:
    mode: all
    selector:
      namespaces: [react-money]
      labelSelectors: {app: postgres}
  delay:
    latency: "100ms"
    jitter: "10ms"
    correlation: "0"
  duration: "5m"
