# Generated by scripts/gen_chaos_dashboards.py — edit the script, not this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-chaos
  namespace: monitoring
data:
  chaos-01-overload.json: |
    {
     "uid": "chaos-01-overload",
     "title": "01 · Граница перегрузки (сетевая задержка к БД)",
     "tags": [
      "chaos",
      "react-money"
     ],
     "timezone": "browser",
     "schemaVersion": 39,
     "refresh": "5s",
     "time": {
      "from": "now-30m",
      "to": "now"
     },
     "panels": [
      {
       "type": "text",
       "title": "Что проверяем",
       "options": {
        "mode": "markdown",
        "content": "**Network → DELAY** backend → postgres (100 / 200 / 300 мс).\n\nПотолок ≈ 20 соединений / задержка. Пока он выше нагрузки — просто медленнее; ниже — очередь растёт без конца. Смотри: задержка и транзакции/с в БД против ответов/с."
       },
       "id": 1,
       "gridPos": {
        "h": 5,
        "w": 16,
        "x": 0,
        "y": 0
       }
      },
      {
       "type": "timeseries",
       "title": "Хаос активен (1 = идёт эксперимент)",
       "description": "Фаза эксперимента из метрик Chaos Mesh",
       "fieldConfig": {
        "defaults": {
         "custom": {
          "lineInterpolation": "stepAfter",
          "fillOpacity": 30
         },
         "min": 0,
         "max": 1
        }
       },
       "targets": [
        {
         "expr": "max by (kind) (chaos_controller_manager_chaos_experiments{namespace=\"react-money\",phase=~\"(?i)running|injecting\"}) or on() vector(0)",
         "legendFormat": "{{kind}}",
         "refId": "A"
        }
       ],
       "id": 2,
       "gridPos": {
        "h": 5,
        "w": 8,
        "x": 16,
        "y": 0
       }
      },
      {
       "type": "timeseries",
       "title": "Задержка API (что ждёт пользователь)",
       "description": "Через Traefik. p95/p99 точны только в пределах бакетов Traefik",
       "fieldConfig": {
        "defaults": {
         "custom": {},
         "unit": "s"
        }
       },
       "targets": [
        {
         "expr": "sum(rate(traefik_service_request_duration_seconds_sum{service=~\"react-money-backend.*\"}[30s])) / sum(rate(traefik_service_request_duration_seconds_count{service=~\"react-money-backend.*\"}[30s]))",
         "legendFormat": "среднее",
         "refId": "A"
        },
        {
         "expr": "histogram_quantile(0.95, sum by (le) (rate(traefik_service_request_duration_seconds_bucket{service=~\"react-money-backend.*\"}[30s])))",
         "legendFormat": "p95",
         "refId": "B"
        },
        {
         "expr": "histogram_quantile(0.99, sum by (le) (rate(traefik_service_request_duration_seconds_bucket{service=~\"react-money-backend.*\"}[30s])))",
         "legendFormat": "p99",
         "refId": "C"
        }
       ],
       "id": 3,
       "gridPos": {
        "h": 8,
        "w": 12,
        "x": 0,
        "y": 5
       }
      },
      {
       "type": "timeseries",
       "title": "Ответы backend в секунду по коду",
       "description": "",
       "fieldConfig": {
        "defaults": {
         "custom": {},
         "unit": "reqps"
        }
       },
       "targets": [
        {
         "expr": "sum by (code) (rate(traefik_service_requests_total{service=~\"react-money-backend.*\"}[30s]))",
         "legendFormat": "{{code}}",
         "refId": "A"
        }
       ],
       "id": 4,
       "gridPos": {
        "h": 8,
        "w": 6,
        "x": 12,
        "y": 5
       }
      },
      {
       "type": "timeseries",
       "title": "Доля неуспешных ответов",
       "description": "",
       "fieldConfig": {
        "defaults": {
         "custom": {},
         "unit": "percent",
         "min": 0
        }
       },
       "targets": [
        {
         "expr": "100 * (sum(rate(traefik_service_requests_total{service=~\"react-money-backend.*\",code!~\"2..\"}[30s])) or on() vector(0)) / sum(rate(traefik_service_requests_total{service=~\"react-money-backend.*\"}[30s]))",
         "legendFormat": "не 2xx",
         "refId": "A"
        }
       ],
       "id": 5,
       "gridPos": {
        "h": 8,
        "w": 6,
        "x": 18,
        "y": 5
       }
      },
      {
       "type": "timeseries",
       "title": "Готовность подов (1 = Ready)",
       "description": "",
       "fieldConfig": {
        "defaults": {
         "custom": {
          "lineInterpolation": "stepAfter",
          "fillOpacity": 30
         },
         "min": 0,
         "max": 1.2
        }
       },
       "targets": [
        {
         "expr": "kube_pod_status_ready{namespace=\"react-money\",pod=~\"backend-.*|postgres-0\",condition=\"true\"}",
         "legendFormat": "{{pod}}",
         "refId": "A"
        }
       ],
       "id": 6,
       "gridPos": {
        "h": 8,
        "w": 8,
        "x": 0,
        "y": 13
       }
      },
      {
       "type": "timeseries",
       "title": "Перезапуски контейнеров",
       "description": "",
       "fieldConfig": {
        "defaults": {
         "custom": {
          "lineInterpolation": "stepAfter",
          "fillOpacity": 30
         },
         "min": 0
        }
       },
       "targets": [
        {
         "expr": "sum by (pod) (kube_pod_container_status_restarts_total{namespace=\"react-money\"})",
         "legendFormat": "{{pod}}",
         "refId": "A"
        }
       ],
       "id": 7,
       "gridPos": {
        "h": 8,
        "w": 8,
        "x": 8,
        "y": 13
       }
      },
      {
       "type": "timeseries",
       "title": "Реплики: HPA и доступные",
       "description": "",
       "fieldConfig": {
        "defaults": {
         "custom": {
          "lineInterpolation": "stepAfter",
          "fillOpacity": 30
         },
         "min": 0
        }
       },
       "targets": [
        {
         "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"react-money\"}",
         "legendFormat": "HPA текущие",
         "refId": "A"
        },
        {
         "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"react-money\"}",
         "legendFormat": "HPA желаемые",
         "refId": "B"
        },
        {
         "expr": "kube_deployment_status_replicas_available{namespace=\"react-money\"}",
         "legendFormat": "доступно: {{deployment}}",
         "refId": "C"
        }
       ],
       "id": 8,
       "gridPos": {
        "h": 8,
        "w": 8,
        "x": 16,
        "y": 13
       }
      },
      {
       "type": "timeseries",
       "title": "Транзакций в секунду в БД",
       "description": "Сколько запросов база реально обработала",
       "fieldConfig": {
        "defaults": {
         "custom": {},
         "unit": "ops",
         "min": 0
        }
       },
       "targets": [
        {
         "expr": "sum(rate(pg_stat_database_xact_commit{datname=\"react_money\"}[30s]))",
         "legendFormat": "commit/s",
         "refId": "A"
        }
       ],
       "id": 9,
       "gridPos": {
        "h": 8,
        "w": 8,
        "x": 0,
        "y": 21
       }
      },
      {
       "type": "timeseries",
       "title": "Соединения к БД по состоянию",
       "description": "",
       "fieldConfig": {
        "defaults": {
         "custom": {},
         "min": 0
        }
       },
       "targets": [
        {
         "expr": "sum by (state) (pg_stat_activity_count{datname=\"react_money\"})",
         "legendFormat": "{{state}}",
         "refId": "A"
        }
       ],
       "id": 10,
       "gridPos": {
        "h": 8,
        "w": 8,
        "x": 8,
        "y": 21
       }
      },
      {
       "type": "timeseries",
       "title": "Открытые соединения в Traefik",
       "description": "Включает простаивающие keep-alive соединения генератора",
       "fieldConfig": {
        "defaults": {
         "custom": {}
        }
       },
       "targets": [
        {
         "expr": "sum(traefik_open_connections{entrypoint=\"web\"})",
         "legendFormat": "web",
         "refId": "A"
        }
       ],
       "id": 11,
       "gridPos": {
        "h": 8,
        "w": 8,
        "x": 16,
        "y": 21
       }
      },
      {
       "type": "timeseries",
       "title": "CPU backend",
       "description": "",
       "fieldConfig": {
        "defaults": {
         "custom": {},
         "unit": "cores",
         "min": 0
        }
       },
       "targets": [
        {
         "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"react-money\",container=\"backend\"}[1m]))",
         "legendFormat": "{{pod}}",
         "refId": "A"
        },
        {
         "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"react-money\",container=\"backend\"}[1m]))",
         "legendFormat": "сумма",
         "refId": "B"
        }
       ],
       "id": 12,
       "gridPos": {
        "h": 8,
        "w": 12,
        "x": 0,
        "y": 29
       }
      },
      {
       "type": "timeseries",
       "title": "Память backend",
       "description": "",
       "fieldConfig": {
        "defaults": {
         "custom": {},
         "unit": "bytes",
         "min": 0
        }
       },
       "targets": [
        {
         "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"react-money\",container=\"backend\"})",
         "legendFormat": "{{pod}}",
         "refId": "A"
        },
        {
         "expr": "sum(container_memory_working_set_bytes{namespace=\"react-money\",container=\"backend\"})",
         "legendFormat": "сумма",
         "refId": "B"
        }
       ],
       "id": 13,
       "gridPos": {
        "h": 8,
        "w": 12,
        "x": 12,
        "y": 29
       }
      }
     ]
    }
