# Postgres metrics for Prometheus: pg_up, connections by state, transactions/s.
# Needs secret monitoring/postgres-exporter with key DATA_SOURCE_PASS (the app DB password).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres-exporter}
  template:
    metadata:
      labels: {app: postgres-exporter}
    spec:
      containers:
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
          env:
            - {name: DATA_SOURCE_URI, value: "postgres.react-money.svc.cluster.local:5432/react_money?sslmode=disable"}
            - {name: DATA_SOURCE_USER, value: "app"}
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef: {name: postgres-exporter, key: DATA_SOURCE_PASS}
          ports:
            - {name: metrics, containerPort: 9187}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /, port: 9187}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: monitoring
spec:
  selector: {app: postgres-exporter}
  ports:
    - {name: metrics, port: 9187, targetPort: 9187}
