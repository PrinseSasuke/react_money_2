apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: react-money
  namespace: react-money
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
