# 01 · norm · Flash-crowd: легитимный резкий наплыв пользователей (высокий rps), но это НОРМА.
# Инструмент: k6 (та же нагрузка нормы, но rate в разы выше — задаётся labctl через _variant)
# Ожидаемый след: rps_total взлетает (сотни–тысячи), open_conns растут — как при флуде,
#                 НО коды ответов 200, латентность в норме, источник — легитимные пользователи.
# Гипотеза (ДВОЙНИК флуда T1499): flash-crowd и DDoS дают одинаковый скачок rps/соединений;
#           различие — при flash-crowd запросы успешные (2xx, нормальная латентность), при флуде
#           растёт доля ошибок/таймаутов и трафик идёт узко/агрессивно. Классическая трудная
#           пара «легитимный наплыв vs DDoS» — самый сильный кейс для статьи.
#
# Файл-маркер: своего объекта-воздействия нет, вся «нагрузка» — это сам k6 на высоком rate.
# Класс norm берётся из имени; высокий rate labctl подставляет в _variant (flash_crowd).
