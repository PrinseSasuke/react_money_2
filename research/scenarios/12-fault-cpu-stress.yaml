# 12 · fault · CPU-стресс backend: 1 воркер на 100% в каждом поде backend, 5 минут.
# Инструмент: Chaos Mesh StressChaos (CNCF)
# Ожидаемый след: cpu_cores / cpu_pct_req упираются в limit, hpa_replicas растёт (цель HPA 70%),
#                 lat может подрасти — симптомы, ВНЕШНЕ похожие на криптоджекинг (класс attack 23).
# Гипотеза: CPU упрётся в limit (300m) ≈ 300% от requests (100m) → HPA добавит реплики; это штатная
#           перегрузка вычислениями, а НЕ майнер — ключевая пара «сбой ↔ атака» для статьи.
#
# Копия k8s/chaos/experiments/08-cpu-stress.yaml (изоляция RULES.md §1.3).
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  generateName: fault-cpu-stress-
  namespace: react-money
spec:
  mode: all
  selector:
    namespaces: [react-money]
    labelSelectors: {app: backend}
  containerNames: [backend]
  stressors:
    cpu:
      workers: 1
      load: 100
  duration: "5m"
