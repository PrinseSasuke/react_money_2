# 11 · fault · Падение пода backend под нагрузкой: убивается один случайный под, мгновенно.
# Инструмент: Chaos Mesh PodChaos (CNCF)
# Ожидаемый след: restarts растёт, ready_backend кратко проседает, возможен всплеск rps_5xx/err_pct,
#                 hpa_replicas может дёрнуться — симптомы, ВНЕШНЕ похожие на эксплойт, роняющий сервис.
# Гипотеза: второй под держит трафик, ReplicaSet поднимает замену за секунды; это штатный сбой,
#           а не атака — детектор не должен путать рестарт с эксплойтом.
#
# pod-kill — мгновенное действие: у объекта нет duration, длительность наблюдения задаёт labctl.
# Копия k8s/chaos/experiments/04-kill-backend.yaml (изоляция RULES.md §1.3).
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  generateName: fault-kill-backend-
  namespace: react-money
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces: [react-money]
    labelSelectors: {app: backend}
  gracePeriod: 0
