# Prod nginx (react-money-app.ru). Until the receipt service it lived only on the server; now it is in git.
server {
    listen 80;
    server_name react-money-app.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name react-money-app.ru;

    ssl_certificate     /etc/letsencrypt/live/react-money-app.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/react-money-app.ru/privkey.pem;

    # Receipt service (mobile app «Чеки» and the site's «Чеки» section). Longer prefix than /api/, so it wins.
    # The upstream is a variable resolved by Docker's DNS on each request: nginx starts and reloads even while
    # receipts-api is down or being rebuilt (a plain hostname would fail the whole config).
    location /api/receipts {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $receipts http://receipts-api:3100;
        proxy_pass $receipts; # no URI part: the full /api/receipts… path goes through as is

        client_max_body_size 11m; # receipt photos up to 10 MB
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;     # /api/receipts/events is a server-sent event stream
        proxy_read_timeout 1h;   # the stream pings every 25 s; this only bounds a stuck upstream
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
